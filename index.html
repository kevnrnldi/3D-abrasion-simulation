<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Simulasi Abrasi 3D</title>
    <link rel="stylesheet" href="style.css" />
    <style></style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="tampil"><div id="hud"></div></div>
      <div id="panel">
        <div class="baris">
          <label for="r"><span>Resistivitas tanah</span><b id="vr"></b></label>
          <input id="r" type="range" min="0" max="500" step="1" value="100" />
        </div>
        <div class="baris">
          <label for="g"
            ><span>Ketinggian gelombang</span><b id="vg"></b
          ></label>
          <input
            id="g"
            type="range"
            min="0"
            max="1.5"
            step="0.01"
            value="0.3"
          />
        </div>
        <div class="baris">
          <label for="a"><span>Kecepatan angin</span><b id="va"></b></label>
          <input id="a" type="range" min="0" max="4" step="0.01" value="1" />
        </div>
        <button id="reset">Kembalikan pantai</button>
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const GEL_MAKS = 1.5;
      const ANGIN_MAKS = 4;
      const PENGARUH_ANGIN = 0.1;
      const AMBANG_MULAI = 0.1;
      const AMBANG_GELOMBANG = 0.5;
      const DAYA_KECIL = 0.15;
      const RES_AIR_LAUT = 12;
      const RES_LEMPUNG_MAKS = 200;
      const RES_TAHAN = 400;
      const KECEPATAN_EROSI = 0.35;

      function hitung(rho, H, V) {
        const Heff = H + PENGARUH_ANGIN * V;
        const Hmaks = GEL_MAKS + PENGARUH_ANGIN * ANGIN_MAKS;
        const daya =
          Heff < AMBANG_MULAI
            ? 0
            : Heff < AMBANG_GELOMBANG
              ? (DAYA_KECIL * (Heff - AMBANG_MULAI)) /
                (AMBANG_GELOMBANG - AMBANG_MULAI)
              : DAYA_KECIL +
                ((1 - DAYA_KECIL) * (Heff - AMBANG_GELOMBANG)) /
                  (Hmaks - AMBANG_GELOMBANG);
        const tanah =
          rho >= RES_TAHAN
            ? 0
            : rho > RES_LEMPUNG_MAKS
              ? (RES_TAHAN - rho) / (RES_TAHAN - RES_LEMPUNG_MAKS)
              : 1 +
                (0.3 * (RES_LEMPUNG_MAKS - Math.max(rho, RES_AIR_LAUT))) /
                  (RES_LEMPUNG_MAKS - RES_AIR_LAUT);
        return {
          Hn: Math.min(1, Heff / Hmaks),
          Vn: V / ANGIN_MAKS,
          Heff,
          tanah,
          laju: daya * tanah,
        };
      }
      function katRes(r) {
        return r <= RES_AIR_LAUT
          ? "Air laut"
          : r <= RES_LEMPUNG_MAKS
            ? "Lempung"
            : r < RES_TAHAN
              ? "Peralihan"
              : "Lempung serpih";
      }
      function katGel(x) {
        return x < 0.5 ? "Rendah" : x < 1.0 ? "Sedang" : "Tinggi";
      }
      function katAng(x) {
        return x < 1.5 ? "Rendah" : x < 2.5 ? "Sedang" : "Tinggi";
      }

      const X0 = -18,
        X1 = 36,
        Z0 = -16,
        Z1 = 16,
        DX = 0.5;
      const NX = Math.round((X1 - X0) / DX) + 1,
        NZ = Math.round((Z1 - Z0) / DX) + 1,
        N = NX * NZ;
      const h = new Float32Array(N),
        basah = new Float32Array(N),
        bising = new Float32Array(N);
      for (let i = 0; i < N; i++) bising[i] = Math.random();

      function sm(a, b, x) {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      }
      function hash(a, b) {
        let n = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
      }
      function noise(x, z) {
        const ix = Math.floor(x),
          iz = Math.floor(z),
          fx = x - ix,
          fz = z - iz,
          u = fx * fx * (3 - 2 * fx),
          v = fz * fz * (3 - 2 * fz);
        const a = hash(ix, iz),
          b = hash(ix + 1, iz),
          c = hash(ix, iz + 1),
          d = hash(ix + 1, iz + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function awal(x, z) {
        const xx = x - (1.2 * Math.sin(z * 0.35) + 0.6 * Math.sin(z * 0.9 + 1));
        let y =
          xx < 0
            ? xx * 0.12
            : 0.1 * Math.min(xx, 10) + 0.03 * Math.max(0, xx - 10);
        y += 1.2 * sm(5, 10, xx);
        y += 0.14 * Math.sin(z * 0.6) * sm(0, 6, xx);
        return Math.max(-2.6, y);
      }
      const keras = new Float32Array(N);
      for (let iz = 0; iz < NZ; iz++)
        for (let ix = 0; ix < NX; ix++) {
          const x = X0 + ix * DX,
            z = Z0 + iz * DX;
          keras[iz * NX + ix] =
            0.7 +
            0.6 *
              (0.6 * noise(x * 0.35, z * 0.35) +
                0.4 * noise(x * 0.9 + 7, z * 0.9 + 3));
        }
      const lantai = new Float32Array(N),
        takik = new Float32Array(N);
      for (let iz = 0; iz < NZ; iz++)
        for (let ix = 0; ix < NX; ix++)
          lantai[iz * NX + ix] =
            -0.25 -
            0.3 * noise((X0 + ix * DX) * 0.35 + 11, (Z0 + iz * DX) * 0.35 + 5);
      function isiAwal() {
        for (let iz = 0; iz < NZ; iz++)
          for (let ix = 0; ix < NX; ix++)
            h[iz * NX + ix] = awal(X0 + ix * DX, Z0 + iz * DX);
      }

      function buatGeometri(kom) {
        const g = new THREE.BufferGeometry();
        const pos = new Float32Array(N * 3);
        for (let iz = 0; iz < NZ; iz++)
          for (let ix = 0; ix < NX; ix++) {
            const i = iz * NX + ix;
            pos[3 * i] = X0 + ix * DX;
            pos[3 * i + 2] = Z0 + iz * DX;
          }
        const idx = [];
        for (let iz = 0; iz < NZ - 1; iz++)
          for (let ix = 0; ix < NX - 1; ix++) {
            const a = iz * NX + ix,
              b = a + 1,
              c = a + NX,
              d = c + 1;
            idx.push(a, c, b, b, c, d);
          }
        g.setIndex(idx);
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        g.setAttribute(
          "color",
          new THREE.BufferAttribute(new Float32Array(N * kom), kom),
        );
        return g;
      }

      const wadah = document.getElementById("tampil");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const kanvas = renderer.domElement;
      kanvas.style.cssText =
        "position:absolute;left:0;top:0;width:100%;height:100%;display:block";
      if (getComputedStyle(wadah).position === "static")
        wadah.style.position = "relative";
      wadah.insertBefore(kanvas, wadah.firstChild);
      const scene = new THREE.Scene();
      const cv = document.createElement("canvas");
      cv.width = 2;
      cv.height = 256;
      const cx = cv.getContext("2d"),
        gr = cx.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, "#5fa8dc");
      gr.addColorStop(0.6, "#bfe0ee");
      gr.addColorStop(1, "#eaf4f2");
      cx.fillStyle = gr;
      cx.fillRect(0, 0, 2, 256);
      scene.background = new THREE.CanvasTexture(cv);
      scene.background.colorSpace = THREE.SRGBColorSpace;
      scene.fog = new THREE.Fog(0xd6ebf0, 70, 150);
      const kamera = new THREE.PerspectiveCamera(50, 1, 0.1, 260);
      kamera.position.set(-8, 10, 21);
      const kontrol = new OrbitControls(kamera, renderer.domElement);
      kontrol.target.set(12, 1, 0);
      kontrol.enableDamping = true;
      kontrol.enablePan = false;
      kontrol.minDistance = 8;
      kontrol.maxDistance = 75;
      kontrol.maxPolarAngle = Math.PI * 0.48;

      scene.add(new THREE.HemisphereLight(0xdcefff, 0x8a7550, 0.8));
      const matahari = new THREE.DirectionalLight(0xfff0d2, 1.25);
      matahari.position.set(22, 26, 18);
      matahari.target.position.set(9, 0, 0);
      scene.add(matahari.target);
      matahari.castShadow = true;
      matahari.shadow.mapSize.set(2048, 2048);
      Object.assign(matahari.shadow.camera, {
        left: -40,
        right: 40,
        top: 34,
        bottom: -34,
        near: 1,
        far: 130,
      });
      matahari.shadow.bias = -0.0006;
      matahari.shadow.normalBias = 0.05;
      scene.add(matahari);

      const gDarat = buatGeometri(3);
      const darat = new THREE.Mesh(
        gDarat,
        new THREE.MeshLambertMaterial({ vertexColors: true }),
      );
      darat.frustumCulled = false;
      darat.receiveShadow = true;
      darat.castShadow = true;
      scene.add(darat);

      const gLaut = buatGeometri(4);
      const bahanLaut = new THREE.MeshPhongMaterial({
        vertexColors: true,
        transparent: true,
        shininess: 110,
        specular: 0x9fb4c0,
        depthWrite: false,
      });
      const laut = new THREE.Mesh(gLaut, bahanLaut);
      laut.frustumCulled = false;
      laut.renderOrder = 2;
      scene.add(laut);
      const cDangkal = new THREE.Color(0x5fd0c8),
        cDalam = new THREE.Color(0x0b5f93),
        cKeruh = new THREE.Color(0xb48a52),
        cBusa = new THREE.Color(0xf4fbfa),
        cc = new THREE.Color();

      const NP = 90,
        pp = new Float32Array(NP * 3);
      for (let i = 0; i < NP; i++) {
        pp[3 * i] = X0 + Math.random() * (X1 - X0);
        pp[3 * i + 1] = 1 + Math.random() * 5;
        pp[3 * i + 2] = Z0 + Math.random() * (Z1 - Z0);
      }
      const gAngin = new THREE.BufferGeometry();
      gAngin.setAttribute("position", new THREE.BufferAttribute(pp, 3));
      const bahanAngin = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.18,
        transparent: true,
        opacity: 0,
      });
      const angin = new THREE.Points(gAngin, bahanAngin);
      angin.frustumCulled = false;
      scene.add(angin);

      function ukuran() {
        const w = wadah.clientWidth,
          hh = wadah.clientHeight;
        if (!w || !hh) return;
        renderer.setSize(w, hh, false);
        kamera.aspect = w / hh;
        kamera.fov = kamera.aspect < 0.8 ? 64 : 48;
        kamera.updateProjectionMatrix();
      }
      let rz = 0;
      new ResizeObserver(() => {
        cancelAnimationFrame(rz);
        rz = requestAnimationFrame(ukuran);
      }).observe(wadah);
      ukuran();

      const c = new THREE.Color();
      const kPasir = new THREE.Color(0xdccb9f),
        kTebing = new THREE.Color(0xb9552b),
        kRumput = new THREE.Color(0x5f8334),
        kDasar = new THREE.Color(0xb3a374);
      const kAspal = new THREE.Color(0x505054),
        kSetapak = new THREE.Color(0xc9b387);
      function warna(y, s, b, n, x, z) {
        c.copy(kPasir);
        if (y < -0.1) c.lerp(kDasar, Math.min(1, (-0.1 - y) / 1.2));
        c.lerp(kTebing, sm(0.32, 0.6, s) * sm(0.1, 0.6, y));
        c.lerp(kRumput, sm(1.0, 1.7, y) * (1 - sm(0.28, 0.5, s)));
        if (y < 0.6) c.multiplyScalar(1 - 0.32 * b * (1 - sm(0.2, 0.6, y)));
        if (x !== undefined && y > 0.8) {
          if (Math.abs(x - (21 + 1.5 * Math.sin(z * 0.2))) < 0.9)
            c.lerp(kAspal, 0.92);
          else if (
            x > 9 &&
            x < 20.5 &&
            Math.abs(z + 3 - 0.5 * Math.sin(x * 0.5)) < 0.5
          )
            c.lerp(kSetapak, 0.8);
        }
        c.multiplyScalar(0.94 + 0.12 * n);
      }
      function perbaruiWarna(dt) {
        const ps = gLaut.attributes.position.array,
          k = gDarat.attributes.color.array;
        for (let iz = 0; iz < NZ; iz++)
          for (let ix = 0; ix < NX; ix++) {
            const i = iz * NX + ix;
            basah[i] =
              ps[3 * i + 1] > h[i] + 0.02
                ? 1
                : Math.max(0, basah[i] - dt * 0.4);
            const s =
              Math.max(
                ix > 0 ? Math.abs(h[i] - h[i - 1]) : 0,
                ix < NX - 1 ? Math.abs(h[i + 1] - h[i]) : 0,
                iz > 0 ? Math.abs(h[i] - h[i - NX]) : 0,
                iz < NZ - 1 ? Math.abs(h[i + NX] - h[i]) : 0,
              ) / DX;
            warna(h[i], s, basah[i], bising[i], X0 + ix * DX, Z0 + iz * DX);
            k[3 * i] = c.r;
            k[3 * i + 1] = c.g;
            k[3 * i + 2] = c.b;
          }
        gDarat.attributes.color.needsUpdate = true;
      }
      function perbaruiBentuk() {
        const p = gDarat.attributes.position.array;
        for (let i = 0; i < N; i++) p[3 * i + 1] = h[i];
        gDarat.attributes.position.needsUpdate = true;
        gDarat.computeVertexNormals();
        dindingDarat.forEach(perbaruiDinding);
        perbaruiPohon();
      }

      const BASE = -3.6,
        R = 4;
      function titikTepi() {
        const depan = [],
          belakang = [],
          kiri = [],
          kanan = [];
        for (let ix = 0; ix < NX; ix++) {
          depan.push({ i: (NZ - 1) * NX + ix, x: X0 + ix * DX, z: Z1 });
          belakang.push({ i: ix, x: X0 + ix * DX, z: Z0 });
        }
        for (let iz = 0; iz < NZ; iz++) {
          kiri.push({ i: iz * NX, x: X0, z: Z0 + iz * DX });
          kanan.push({ i: iz * NX + NX - 1, x: X1, z: Z0 + iz * DX });
        }
        return { depan, belakang, kiri, kanan };
      }
      function buatDinding(titik, baris) {
        const n = titik.length,
          g = new THREE.BufferGeometry();
        g.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(n * baris * 3), 3),
        );
        g.setAttribute(
          "color",
          new THREE.BufferAttribute(new Float32Array(n * baris * 3), 3),
        );
        const idx = [];
        for (let k = 0; k < n - 1; k++)
          for (let r = 0; r < baris - 1; r++) {
            const a = k * baris + r,
              b = a + baris,
              d = b + 1,
              e = a + 1;
            idx.push(a, b, e, b, d, e);
          }
        g.setIndex(idx);
        return { g, titik };
      }
      const tepi = titikTepi();
      const bahanDinding = new THREE.MeshLambertMaterial({
        vertexColors: true,
        side: THREE.DoubleSide,
      });
      const dindingDarat = [
        tepi.depan,
        tepi.belakang,
        tepi.kiri,
        tepi.kanan,
      ].map((t) => {
        const d = buatDinding(t, R);
        const m = new THREE.Mesh(d.g, bahanDinding);
        m.frustumCulled = false;
        m.receiveShadow = true;
        scene.add(m);
        return d;
      });
      const bahanDindingAir = new THREE.MeshBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.72,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const dindingAir = [tepi.depan, tepi.belakang, tepi.kiri].map((t) => {
        const d = buatDinding(t, 2);
        const m = new THREE.Mesh(d.g, bahanDindingAir);
        m.frustumCulled = false;
        m.renderOrder = 1;
        scene.add(m);
        return d;
      });
      const lapisan = [
        new THREE.Color(0xa8462a),
        new THREE.Color(0xb5532f),
        new THREE.Color(0xd2a064),
      ]; // lempung serpih, lempung
      function perbaruiDinding(d) {
        const p = d.g.attributes.position.array,
          k = d.g.attributes.color.array;
        d.titik.forEach((q, j) => {
          const atas = h[q.i],
            ys = [BASE, Math.min(atas, -2.0), Math.min(atas, -0.6), atas];
          for (let r = 0; r < R; r++) {
            const o = (j * R + r) * 3;
            p[o] = q.x;
            p[o + 1] = ys[r];
            p[o + 2] = q.z;
            if (r < R - 1) c.copy(lapisan[r]);
            else warna(atas, 0, 0, 0.5);
            k[o] = c.r;
            k[o + 1] = c.g;
            k[o + 2] = c.b;
          }
        });
        d.g.attributes.position.needsUpdate = true;
        d.g.attributes.color.needsUpdate = true;
        d.g.computeVertexNormals();
      }
      const wAtas = new THREE.Color(),
        wBawah = new THREE.Color();
      function perbaruiDindingAir(keruhan) {
        const ps = gLaut.attributes.position.array;
        wAtas
          .copy(cDangkal)
          .lerp(cDalam, 0.4)
          .lerp(cKeruh, keruhan * 0.6);
        wBawah.copy(cDalam).multiplyScalar(0.7);
        dindingAir.forEach((d) => {
          const p = d.g.attributes.position.array,
            k = d.g.attributes.color.array;
          d.titik.forEach((q, j) => {
            const atas = ps[3 * q.i + 1],
              dasar = h[q.i],
              bawah = atas - dasar < 0.12 ? atas : dasar;
            for (let r = 0; r < 2; r++) {
              const o = (j * 2 + r) * 3,
                cw = r ? wAtas : wBawah;
              p[o] = q.x;
              p[o + 1] = r ? atas : bawah;
              p[o + 2] = q.z;
              k[o] = cw.r;
              k[o + 1] = cw.g;
              k[o + 2] = cw.b;
            }
          });
          d.g.attributes.position.needsUpdate = true;
          d.g.attributes.color.needsUpdate = true;
        });
      }

      const cacheBahan = {};
      const mat = (w) =>
        cacheBahan[w] ||
        (cacheBahan[w] = new THREE.MeshLambertMaterial({ color: w }));
      function kotak(w, t, d, wr, x = 0, y = 0, z = 0) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, t, d), mat(wr));
        m.position.set(x, y, z);
        return m;
      }
      function tabung(r, t, wr, x = 0, y = 0, z = 0) {
        const m = new THREE.Mesh(
          new THREE.CylinderGeometry(r, r, t, 6),
          mat(wr),
        );
        m.position.set(x, y, z);
        return m;
      }
      function limas(r, t, wr, y) {
        const m = new THREE.Mesh(new THREE.ConeGeometry(r, t, 4), mat(wr));
        m.rotation.y = Math.PI / 4;
        m.position.y = y;
        return m;
      }
      function rumah(w, d, t, dinding, atap) {
        const g = new THREE.Group();
        g.add(
          kotak(w, t, d, dinding, 0, t / 2, 0),
          limas(Math.max(w, d) * 0.82, t * 0.75, atap, t * 1.37),
          kotak(0.45, t * 0.62, 0.06, 0x6b4a2b, 0, t * 0.31, d / 2 + 0.03),
          kotak(0.45, 0.4, 0.06, 0xbfe3ee, w * 0.28, t * 0.55, d / 2 + 0.03),
        );
        return g;
      }
      function pondok() {
        // pondok/gazebo wisata
        const g = new THREE.Group();
        g.add(
          kotak(3, 0.15, 3, 0xb08a5a, 0, 0.3, 0),
          limas(2.5, 1.1, 0x6f8a3a, 2.8),
        );
        [
          [-1.3, -1.3],
          [1.3, -1.3],
          [-1.3, 1.3],
          [1.3, 1.3],
        ].forEach(([x, z]) => g.add(tabung(0.07, 2, 0x7a5a3a, x, 1.3, z)));
        return g;
      }
      function musholla() {
        const g = rumah(3.2, 3.2, 2.0, 0xf2efe4, 0x2f7d5b);
        const k = new THREE.Mesh(
          new THREE.SphereGeometry(0.35, 8, 6),
          mat(0xe0b84a),
        );
        k.position.y = 3.45;
        g.add(k);
        return g;
      }
      function toilet() {
        const g = new THREE.Group();
        g.add(
          kotak(1.2, 1.6, 1.2, 0x8fc3d8, 0, 0.8, 0),
          kotak(1.4, 0.1, 1.4, 0x56758a, 0, 1.65, 0),
          kotak(0.4, 0.9, 0.05, 0x3d5a6b, 0, 0.5, 0.62),
        );
        return g;
      }
      function lampu() {
        const g = new THREE.Group();
        g.add(
          tabung(0.05, 2.6, 0x44464a, 0, 1.3, 0),
          kotak(0.5, 0.12, 0.25, 0xe9e3c8, 0.25, 2.6, 0),
        );
        return g;
      }
      function ayunan() {
        const g = new THREE.Group(),
          pt = 0xf2f2ee,
          ky = 0xcfc3a8;
        g.add(kotak(4.4, 0.14, 3.2, ky, -1.4, 0.9, 0));
        [
          [-3.4, -1.4],
          [-3.4, 1.4],
          [0.6, -1.4],
          [0.6, 1.4],
        ].forEach(([x, z]) => g.add(tabung(0.07, 1.6, 0x8a7656, x, 0.1, z)));
        g.add(
          kotak(0.06, 0.06, 3.2, pt, -3.6, 1.9, 0),
          kotak(4.4, 0.06, 0.06, pt, -1.4, 1.9, -1.55),
          kotak(4.4, 0.06, 0.06, pt, -1.4, 1.9, 1.55),
        );
        [-1.55, -0.5, 0.5, 1.55].forEach((z) =>
          g.add(tabung(0.03, 0.9, pt, -3.6, 1.47, z)),
        );
        [-1.55, 1.55].forEach((z) =>
          [-3.6, -2.5, -1.4, -0.3].forEach((x) =>
            g.add(tabung(0.03, 0.9, pt, x, 1.47, z)),
          ),
        );
        const x0 = -3.0;
        [-1.0, 1.0].forEach((z) => {
          const k1 = tabung(0.06, 3.52, pt, x0 + 0.45, 2.67, z);
          k1.rotation.z = 0.259;
          g.add(k1);
          const k2 = tabung(0.06, 3.52, pt, x0 - 0.45, 2.67, z);
          k2.rotation.z = -0.259;
          g.add(k2);
        });
        const bm = tabung(0.07, 2.4, pt, x0, 4.4, 0);
        bm.rotation.x = Math.PI / 2;
        g.add(bm);
        [-0.3, 0.3].forEach((z) =>
          g.add(tabung(0.015, 2.5, 0x333333, x0, 3.1, z)),
        );
        g.add(kotak(0.5, 0.06, 0.9, ky, x0, 1.9, 0));
        return g;
      }
      const bangunan = [];
      let hilangN = 0;
      function pasang(g, x, z, r, miring) {
        g.position.x = x;
        g.position.z = z;
        g.traverse((m) => {
          m.castShadow = true;
          m.receiveShadow = true;
        });
        scene.add(g);
        const idx = [
          [-r, 0],
          [r, 0],
          [0, -r],
          [0, r],
        ].map(
          ([p, q]) =>
            Math.round((z + q - Z0) / DX) * NX + Math.round((x + p - X0) / DX),
        );
        bangunan.push({
          g,
          idx,
          miring: miring === undefined ? 0.3 : miring,
          hilang: false,
        });
      }
      pasang(ayunan(), 13, -3, 3, 0.25);
      pasang(pondok(), 16, 8, 1.7);
      [
        [26, -6, 3.4, 2.8, 0xcfe3ea, 0xb5472f],
        [30, 4, 3.8, 3.0, 0xf2e6c9, 0x6d7f8a],
        [28, -12, 3.2, 2.8, 0xe9d3d0, 0x8a5a3a],
      ].forEach(([x, z, w, d, dn, at]) =>
        pasang(rumah(w, d, 2.1, dn, at), x, z, 2, 0.2),
      );
      [-7, 7].forEach((z) =>
        pasang(lampu(), 22.6 + 1.5 * Math.sin(z * 0.2), z, 0.3, 0.5),
      );

      let sd = 12345;
      const rnd = () =>
        (sd = (Math.imul(sd, 1664525) + 1013904223) >>> 0) / 4294967296;
      function bebas(x, z, j) {
        return (
          Math.abs(x - (21 + 1.5 * Math.sin(z * 0.2))) > 1.4 &&
          !bangunan.some(
            (q) => Math.hypot(q.g.position.x - x, q.g.position.z - z) < j,
          )
        );
      }
      const bBatang = mat(0x5a4129),
        bDaun = [mat(0x2f5d2a), mat(0x3f7a35)];
      const pohon = [];
      function tanam(g, x, z) {
        g.traverse((m) => {
          m.castShadow = true;
        });
        g.position.set(x, 0, z);
        scene.add(g);
        pohon.push({
          g,
          i: Math.round((z - Z0) / DX) * NX + Math.round((x - X0) / DX),
        });
      }
      function cemara(n, sk) {
        const g = new THREE.Group();
        g.add(tabung(0.1 * sk, 1.1 * sk, 0x5a4129, 0, 0.55 * sk, 0));
        [
          [1.0, 0.62],
          [1.55, 0.48],
          [2.0, 0.32],
        ].forEach(([y, r], k) => {
          const d = new THREE.Mesh(
            new THREE.ConeGeometry(r * sk, 0.95 * sk, 7),
            bDaun[(n + k) % 2],
          );
          d.position.y = y * sk;
          g.add(d);
        });
        return g;
      }
      for (let n = 0; n < 8; n++) {
        const g = cemara(n, 0.9 + 0.4 * rnd());
        g.rotation.z = 0.1 + 0.1 * rnd();
        tanam(g, 7.5 + 3 * rnd(), Z0 + 2 + rnd() * (Z1 - Z0 - 4));
      } // cemara condong di tepi tebing
      for (let n = 0, k = 0; n < 44 && k < 400; k++) {
        const x = 11 + rnd() * 25,
          z = Z0 + 1 + rnd() * (Z1 - Z0 - 2);
        if (bebas(x, z, 2.6)) {
          tanam(cemara(n, 0.85 + 0.4 * rnd()), x, z);
          n++;
        }
      }
      for (let n = 0, k = 0; n < 36 && k < 400; k++) {
        const x = 8 + rnd() * 27,
          z = Z0 + 1 + rnd() * (Z1 - Z0 - 2);
        if (bebas(x, z, 2.2)) {
          // semak hijau
          const g = new THREE.Group(),
            sk = 0.5 + 0.5 * rnd(),
            m = new THREE.Mesh(
              new THREE.IcosahedronGeometry(0.5, 0),
              mat(0x4f9a3a),
            );
          m.scale.set(sk * 1.3, sk * 0.8, sk * 1.3);
          m.position.y = 0.25 * sk;
          g.add(m);
          tanam(g, x, z);
          n++;
        }
      }
      function perbaruiPohon() {
        pohon.forEach((q) => {
          const y = h[q.i];
          q.g.position.y = y;
          q.g.visible = y > 0.4;
        });
        hilangN = 0;
        bangunan.forEach((q) => {
          const hs = q.idx.map((i) => h[i]),
            mn = Math.min(...hs);
          q.g.position.y = hs.reduce((a, v) => a + v, 0) / hs.length;
          q.hilang = mn < 0.4;
          q.g.visible = !q.hilang;
          if (q.hilang) hilangN++;
          q.g.rotation.z = q.miring * (1 - sm(0.4, 1.5, mn)); // miring ke arah laut saat tanah di bawahnya terkikis
        });
      }
      const bBatu = new THREE.MeshLambertMaterial({
        color: 0x6d6258,
        flatShading: true,
      });
      [
        [-2.5, -6, 0.7],
        [-1.5, -3.5, 0.5],
        [-3, -1, 0.8],
        [-1, 1.5, 0.45],
        [-2.2, 4, 0.65],
        [-3.4, 7, 0.55],
        [-0.8, 7.5, 0.4],
        [-1.5, -13.5, 1.0],
        [-1.0, -13, 0.7],
        [-2, -12.5, 0.6],
        [-2, 13, 1.0],
        [-1.2, 13.6, 0.7],
        [-3, -10, 0.5],
        [-2.5, 10.5, 0.6],
        [-1.8, -8.5, 0.4],
      ].forEach(([x, z, sz]) => {
        const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), bBatu);
        m.scale.set(sz * 1.2, sz * 0.8, sz);
        m.rotation.set(z, x, z * 0.5);
        m.position.set(x, awal(x, z) + sz * 0.25, z);
        m.castShadow = true;
        m.receiveShadow = true;
        scene.add(m);
      });

      function erosi(dt, laju, t) {
        const e0 = laju * KECEPATAN_EROSI * dt;
        for (let iz = 1; iz < NZ - 1; iz++)
          for (let ix = 1; ix < NX - 1; ix++) {
            const i = iz * NX + ix;
            if (h[i] <= 0.02) continue;
            const depan =
              h[i - 1] <= 0.02
                ? 1
                : h[i - NX] <= 0.02 || h[i + NX] <= 0.02
                  ? 0.6
                  : 0;
            if (!depan) continue;
            takik[i] +=
              e0 *
              depan *
              keras[i] *
              (0.4 + 1.2 * Math.random()) *
              (0.4 + 1.2 * noise(ix * 0.22 + t * 0.3, iz * 0.22));
            if (takik[i] > 0.04 + 0.2 * h[i]) {
              h[i] = lantai[i];
              takik[i] = 0;
            }
          }
        if (Math.random() < laju * dt * 2.5) {
          const iz = 2 + Math.floor(Math.random() * (NZ - 4));
          let ix = 1;
          while (ix < NX - 3 && h[iz * NX + ix] <= 0.02) ix++;
          const amt = (0.15 + 0.5 * Math.random()) * Math.min(1, laju),
            rad = 2 + Math.floor(Math.random() * 3);
          for (let dz = -rad; dz <= rad; dz++)
            for (let dx = 0; dx <= rad + 1; dx++) {
              const jx = ix + dx,
                jz = iz + dz;
              if (jx < 1 || jx >= NX - 1 || jz < 1 || jz >= NZ - 1) continue;
              const j = jz * NX + jx;
              if (h[j] > 0.02) {
                h[j] -=
                  amt * Math.exp(-(dz * dz + dx * dx) / (rad * rad)) * keras[j];
                if (h[j] <= 0.02) h[j] = lantai[j];
              }
            }
        }
        const nb = [-1, 1, -NX, NX];
        for (let iz = 1; iz < NZ - 1; iz++)
          for (let ix = 1; ix < NX - 1; ix++) {
            const i = iz * NX + ix,
              mk = 1.1 + 0.6 * keras[i];
            for (const o of nb) {
              const d = h[i] - h[i + o];
              if (d > mk) h[i] -= (d - mk) * 0.12;
            }
          }
      }
      function garisPantai() {
        let total = 0;
        for (let iz = 0; iz < NZ; iz++) {
          let xs = NX - 1;
          for (let ix = 0; ix < NX; ix++)
            if (h[iz * NX + ix] > 0.02) {
              xs = ix;
              break;
            }
          total += X0 + xs * DX;
        }
        return total / NZ;
      }

      function gerakLaut(t, Hn, Vn, keruhan) {
        const p = gLaut.attributes.position.array,
          k = gLaut.attributes.color.array;
        const A = 0.04 + 0.32 * Hn,
          c1 = 1.0 + 1.8 * Vn,
          c2 = 0.7 + 1.0 * Vn,
          chop = 0.015 + 0.1 * Vn;
        const muka = 0.12 * Hn + 0.04 * Vn; // muka air naik saat gelombang besar: air laut masuk ke darat
        const grup = 0.75 + 0.25 * Math.sin(t * 0.5); // gelombang datang berkelompok
        for (let i = 0; i < N; i++) {
          const x = p[3 * i],
            z = p[3 * i + 2],
            hi = h[i];
          const d0 = Math.max(0, -hi),
            sh = 1 + 0.8 * (1 - sm(0, 1.6, d0)); // membesar saat air dangkal
          const f1 = Math.sin(0.55 * x + 0.2 * z - t * c1),
            gel = f1 + 0.5 * Math.sin(0.9 * z + 0.7 * x - t * c2); // datang miring terhadap pantai
          let amp = A * sh * grup,
            y,
            pecah = 0;
          if (hi < 0) {
            const lim = 0.4 * d0 + 0.05; // gelombang pecah di air dangkal
            if (amp > lim) {
              pecah =
                Math.min(1, (amp - lim) / 0.2) * Math.pow(Math.max(0, f1), 2);
              amp = lim;
            }
            y = muka + amp * gel + chop * Math.sin(2.1 * x + 1.7 * z - t * 3.5);
          } else {
            // di darat: air naik sebagai lapisan tipis (swash)
            const Ls =
              muka +
              amp *
                0.9 *
                Math.max(0, f1) *
                (0.5 + noise(x * 0.3 + t * 0.2, z * 0.25 - t * 0.1));
            const film = Math.min(0.09, Ls - hi);
            y = film > 0 ? hi + film : hi - 0.05;
          }
          p[3 * i + 1] = y;
          const d = y - hi,
            dalam = sm(0.05, 2.2, d);
          cc.copy(cDangkal).lerp(cDalam, dalam);
          if (keruhan > 0)
            cc.lerp(
              cKeruh,
              keruhan *
                (1 - dalam) *
                (0.5 + 0.8 * noise(x * 0.6 + t * 0.25, z * 0.6 - t * 0.15)),
            );
          let a = d <= 0 ? 0 : sm(0, 0.15, d) * 0.5 + 0.35 * sm(0.1, 1.2, d);
          if (d > 0) {
            const pola = noise(x * 1.4 + t * 0.8, z * 1.4 - t * 1.1); // busa hanyut menyusur pantai (arus sejajar pantai)
            const f = Math.min(
              1,
              (1 - sm(0, 0.025 + 0.05 * Hn, d)) * (0.5 + 0.8 * pola) +
                pecah * Math.max(0, pola - 0.3) * 1.2,
            );
            cc.lerp(cBusa, f);
            a = Math.max(a, 0.8 * f);
          }
          k[4 * i] = cc.r;
          k[4 * i + 1] = cc.g;
          k[4 * i + 2] = cc.b;
          k[4 * i + 3] = a;
        }
        gLaut.attributes.position.needsUpdate = true;
        gLaut.attributes.color.needsUpdate = true;
        gLaut.computeVertexNormals();
      }
      function gerakAngin(dt, Vn) {
        bahanAngin.opacity = Vn > 0 ? 0.3 + 0.5 * Vn : 0;
        if (Vn <= 0) return;
        for (let i = 0; i < NP; i++) {
          pp[3 * i] += Vn * 9 * dt;
          if (pp[3 * i] > X1) pp[3 * i] = X0;
        }
        gAngin.attributes.position.needsUpdate = true;
      }

      /* ----- antarmuka ----- */
      const sR = document.getElementById("r"),
        sG = document.getElementById("g"),
        sA = document.getElementById("a");
      const vR = document.getElementById("vr"),
        vG = document.getElementById("vg"),
        vA = document.getElementById("va");
      const hud = document.getElementById("hud");
      function labelSlider() {
        vR.textContent = sR.value + " Ω·m · " + katRes(+sR.value);
        vG.textContent = (+sG.value).toFixed(2) + " m · " + katGel(+sG.value);
        vA.textContent = (+sA.value).toFixed(2) + " m/s · " + katAng(+sA.value);
      }
      [sR, sG, sA].forEach((s) => s.addEventListener("input", labelSlider));
      labelSlider();
      document.querySelectorAll("[data-tahun]").forEach((b) =>
        b.addEventListener("click", () => {
          const d = BMKG[b.dataset.tahun];
          sG.value = d[0];
          sA.value = d[1];
          labelSlider();
        }),
      );

      let xs0 = 0,
        kotor = true;
      function ulang() {
        isiAwal();
        basah.fill(0);
        takik.fill(0);
        xs0 = garisPantai();
        kotor = true;
      }
      document.getElementById("reset").addEventListener("click", ulang);
      ulang();

      const lompat = +new URLSearchParams(location.search).get("lompat") || 0; // opsional: percepat simulasi untuk uji
      let t = 0,
        terakhir = performance.now();
      function putar(now) {
        const dt = Math.min(0.05, (now - terakhir) / 1000);
        terakhir = now;
        t += dt;
        const r = hitung(+sR.value, +sG.value, +sA.value);
        const keruhan = Math.min(0.55, r.laju * 0.7);
        if (r.laju > 0) {
          for (let q = 0; q <= lompat; q++) erosi(dt, r.laju, t);
          kotor = true;
        }
        gerakLaut(t, r.Hn, r.Vn, keruhan);
        perbaruiWarna(dt);
        if (kotor) {
          perbaruiBentuk();
          kotor = false;
        }
        perbaruiDindingAir(keruhan);
        gerakAngin(dt, r.Vn);

        const mundur = Math.max(0, garisPantai() - xs0);
        const status =
          mundur < 0.3
            ? "Pantai aman"
            : mundur < 3
              ? "Abrasi ringan"
              : mundur < 7
                ? "Abrasi sedang"
                : "Abrasi berat";
        const alasan =
          r.tanah === 0
            ? "Material tahan: tidak terjadi abrasi"
            : r.laju === 0
              ? "Laju gelombang di bawah " +
                AMBANG_MULAI.toFixed(2) +
                " m: belum terjadi pengikisan"
              : r.Heff < AMBANG_GELOMBANG
                ? "Pengikisan kecil (gelombang di bawah " +
                  AMBANG_GELOMBANG +
                  " m)"
                : "Pengikisan aktif";
        hud.innerHTML =
          "<b>" +
          status +
          "</b><br>Garis pantai mundur: " +
          mundur.toFixed(1) +
          " m<br>" +
          "Gelombang efektif: " +
          r.Heff.toFixed(2) +
          " m | Laju: " +
          r.laju.toFixed(2) +
          "<br>" +
          alasan;

        kontrol.update();
        renderer.render(scene, kamera);
        requestAnimationFrame(putar);
      }
      requestAnimationFrame(putar);
    </script>
